<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .phone-frame {
    width: 340px;
    height: 520px;
    background: #334155;
    border-radius: 32px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    overflow: hidden;
    border: 5px solid #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }
  .dialog-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 22px;
    width: 100%;
    box-shadow: 0 15px 25px rgba(0,0,0,0.25);
  }
  .dialog-title {
    font-size: 17px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 8px;
  }
  .dialog-desc {
    font-size: 13px;
    color: #64748b;
    line-height: 1.45;
    margin-bottom: 20px;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .btn-cancel {
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    color: #64748b;
    background: #f1f5f9;
  }
  .btn-delete {
    background: #ef4444;
    color: white;
    padding: 8px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="dialog-card">
    <div class="dialog-title">Delete Transaction?</div>
    <div class="dialog-desc">Are you sure you want to delete this transaction from your business records? This updates your balance immediately.</div>
    <div class="actions">
      <div class="btn-cancel">Cancel</div>
      <div class="btn-delete">Delete</div>
    </div>
  </div>
</div>
</body>
</html>
